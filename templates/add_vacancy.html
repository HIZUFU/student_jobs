{% extends "base.html" %}

{% block title %}{{ t('add_vacancy') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2 class="mb-4">{{ t('new_vacancy') }}</h2>
    
    <form method="POST" action="/add">
      <div class="mb-3">
        <label for="title" class="form-label">{{ t('name_of_vacancy') }}</label>
          <input type="text" class="form-control" id="title" name="title" placeholder="{{ t('chose_of_company') }}" required>
      </div>

      <div class="mb-4">
        <label for="department_id" class="form-label">{{ t('department') }}</label>
        <select id="department_id" name="department_id" class="form-control" placeholder="{{ t('select_department') }}" required>
          <option value=""></option>
          {% for dept in departments %}
            <option value="{{ dept.id }}">{{ get_db_lang(dept, 'name') }}</option>
          {% endfor %}
        </select>
      </div>
      
      <div class="mb-4">
        <label for="description" class="form-label">Описание вакансии</label>
        <textarea class="form-control" id="description" name="description" rows="6" placeholder="введите описание вакансии (минимум 100 символов)" required>{{ request.form.get('description', '') }}</textarea>
        <div id="char-count-help" class="form-text text-danger mt-2">
          Написано символов: <span id="char-count" class="fw-bold">0</span> из 100 необходимых.
        </div>
      </div>
      <div class="row mb-3">
    <div class="col-md-4">
        <label for="salary_from" class="form-label fw-bold">Зарплата от (руб.)</label>
        <input type="number" class="form-control" id="salary_from" name="salary_from" placeholder="Например: 50000">
    </div>
    <div class="col-md-4">
        <label for="salary_to" class="form-label fw-bold">Зарплата до (руб.)</label>
        <input type="number" class="form-control" id="salary_to" name="salary_to" placeholder="Например: 100000">
    </div>
    <div class="col-md-4">
        <label for="employment_type" class="form-label fw-bold">Тип занятости</label>
        <select class="form-select" id="employment_type" name="employment_type">
            <option value="Полный день">Полный день</option>
            <option value="Гибкий график">Гибкий график</option>
            <option value="Удаленная работа">Удаленная работа</option>
            <option value="Частичная занятость">Частичная занятость</option>
        </select>
    </div>
</div>

<div class="form-check form-switch mb-4">
    <input class="form-check-input" type="checkbox" id="is_internship" name="is_internship" value="yes">
    <label class="form-check-label" for="is_internship">Это стажировка / программа обучения</label>
</div>
      
      <button type="submit" id="submit-btn" class="btn btn-primary" disabled>{{ t('publish') }}</button>
    </form>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    new TomSelect("#department_id", {
      create: true,
      sortField: {
        field: "text",
        direction: "asc"
      }
    });

    const descInput = document.getElementById('description');
    const charCountSpan = document.getElementById('char-count');
    const helpText = document.getElementById('char-count-help');
    const submitBtn = document.getElementById('submit-btn');

    function updateCharCount() {
      const chars = descInput.value.trim().length;
      charCountSpan.textContent = chars;

      if (chars < 100) {
        helpText.className = 'form-text text-danger mt-2';
        submitBtn.disabled = true;
      } else {
        helpText.className = 'form-text text-success mt-2';
        submitBtn.disabled = false;
      }
    }

    descInput.addEventListener('input', updateCharCount);
    updateCharCount(); 
  });
</script>
{% endblock %}
