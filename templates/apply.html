{% extends "base.html" %}
{% block title %}Отклик на вакансию{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-5">
        <a href="/vacancy/{{ vacancy.id }}" class="text-decoration-none text-muted mb-4 d-inline-block">&larr; Назад к вакансии</a>
        
        <h3 class="mb-2">Отклик на: {{ vacancy.title_ru }}</h3>
        <h6 class="text-primary mb-4">{{ vacancy.company }}</h6>

        <form method="POST">
          <div class="mb-4">
            <label for="cover_letter" class="form-label fw-bold">Сопроводительное письмо</label>
            <textarea class="form-control bg-light" id="cover_letter" name="cover_letter" rows="8" placeholder="Здравствуйте! Меня заинтересовала ваша вакансия, потому что..." required>{% if existing_app %}{{ existing_app.cover_letter }}{% endif %}</textarea>
            <div class="form-text mt-2">Расскажите, почему вы подходите на эту роль, укажите ваши навыки, достижения и контакты для связи.</div>
          </div>
          <input type="file" class="form-control">
          <div class="d-flex justify-content-between align-items-center mt-5">
            <button type="submit" name="action" value="draft" class="btn btn-outline-secondary px-4">
              Сохранить черновик
            </button>
            <button type="submit" name="action" value="send" class="btn btn-primary px-5 btn-lg">
              Отправить работодателю
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
